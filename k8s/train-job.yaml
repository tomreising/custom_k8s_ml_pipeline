apiVersion: batch/v1
kind: Job
metadata:
  name: sklearn-regression
  labels:
    app.kubernetes.io/managed-by: mlk8s
    mlk8s/job-type: training
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: mlk8s
        job-name: sklearn-regression
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: sklearn-regression:0.1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
